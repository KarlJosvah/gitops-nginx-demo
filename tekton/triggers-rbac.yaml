apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-pipeline-sa-eventlistener-binding
  namespace: web
subjects:
  - kind: ServiceAccount
    name: tekton-pipeline-sa
    namespace: web
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-pipeline-sa-eventlistener-clusterbinding
subjects:
  - kind: ServiceAccount
    name: tekton-pipeline-sa
    namespace: web
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
  apiGroup: rbac.authorization.k8s.io