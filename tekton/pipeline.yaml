apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-deploy-pipeline
  namespace: web
spec:
  params:
    - name: repo-url
      type: string
    - name: image-tag
      type: string
    - name: ghcr-username
      type: string
  workspaces:
    - name: shared-workspace
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.repo-url)

    - name: build-and-push
      runAfter: ["fetch-source"]
      taskRef:
        name: build-and-push
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: ghcr.io/$(params.ghcr-username)/gitops-demo:$(params.image-tag)

    - name: update-manifest
      runAfter: ["build-and-push"]
      taskRef:
        name: update-manifest
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: image
          value: ghcr.io/$(params.ghcr-username)/gitops-demo:$(params.image-tag)